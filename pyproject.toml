[project]
name = "head-hunter"
dynamic = ["version"]
description = "A package for adding custom player heads to the Wandering Trader's trade list"
readme = "README.md"
authors = [
    { name = 'Gili "OpenBagTwo" Barlev', email = "openbagtwo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyperclip>=1.11.0",
    "requests>=2.28",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.ruff.lint]
ignore = ["TRY201"]

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "jupyterlab>=4.6.4",
    "jupyterlab-code-formatter>=3.1.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.2",
    "types-requests>=2.28",
]
docs = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-jupyter>=0.27.0",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-section-index>=0.3.12",
    "mkdocs-windmill>=1.0.5",
    "mkdocstrings[python]>=1.0.8",
    "properdocs>=1.6.7",
]
