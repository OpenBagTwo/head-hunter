repos:
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix]
  - id: pretty-format-ini
    args: [--autofix]
    files: ^.*\.(cfg|CFG|ini|INI)$
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-json
    types: [file]
    files: .*\.(mcmeta|json)$
    exclude: src/head_hunter/templates/pack.mcmeta
  - id: pretty-format-json
    args: [--autofix, --indent=2, --no-ensure-ascii]
    exclude: src/head_hunter/templates/pack.mcmeta
  - id: trailing-whitespace
  - id: check-executables-have-shebangs
  - id: end-of-file-fixer
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.50.0
  hooks:
  - id: markdownlint-fix
    args: [--disable, MD013, MD033, MD036 --]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.2
  hooks:
  - id: ruff-check
    types_or: [python, pyi, jupyter, pyproject]
    args: [--fix]
  - id: ruff-format
    types_or: [python, pyi, jupyter]
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.4.0
  hooks:
  - id: mypy
    args: [--python-version=3.10, --ignore-missing-imports]
    additional_dependencies:
    - types-requests
